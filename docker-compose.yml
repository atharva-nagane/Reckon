services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reckon
      POSTGRES_PASSWORD: reckon
      POSTGRES_DB: reckon
    ports:
      - "5432:5432"
    volumes:
      - reckon-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  reckon-postgres:
